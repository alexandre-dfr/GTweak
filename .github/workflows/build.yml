name: Build

# Compile l'exe Release (net48, WPF) sur Windows, lance les tests et publie GamingTweaker.exe en artefact.
# Téléchargement : onglet Actions, exécution du jour, section « Artifacts ».
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurer
        run: dotnet restore GamingTweaker.sln

      - name: Compiler (Release, requireAdministrator)
        run: dotnet build src/GamingTweaker/GamingTweaker.csproj -c Release --no-restore

      - name: Vérifier le manifeste de l'exe
        shell: pwsh
        run: |
          $exe = 'src/GamingTweaker/bin/Release/net48/GamingTweaker.exe'
          if (-not (Test-Path $exe)) { throw "exe introuvable : $exe" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $txt = [Text.Encoding]::ASCII.GetString($bytes)
          if ($txt -notmatch 'requireAdministrator') { throw 'Le manifeste requireAdministrator est absent de l''exe Release.' }
          if ($txt -notmatch 'PerMonitorV2') { throw 'Le manifeste DPI PerMonitorV2 est absent de l''exe Release.' }
          Get-Item $exe | Select-Object Name, Length, @{n='Version';e={$_.VersionInfo.FileVersion}}
          "SHA-256 : " + (Get-FileHash $exe -Algorithm SHA256).Hash

      - name: Tests
        id: tests
        continue-on-error: true
        run: dotnet test tests/GamingTweaker.Tests/GamingTweaker.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Publier l'exe
        uses: actions/upload-artifact@v4
        with:
          name: GamingTweaker-exe
          path: |
            src/GamingTweaker/bin/Release/net48/GamingTweaker.exe
            src/GamingTweaker/bin/Release/net48/GamingTweaker.exe.config
          if-no-files-found: error

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: TestResults
          if-no-files-found: ignore

      - name: Bilan des tests
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::warning::Des tests ont échoué : voir l'artefact resultats-tests. L'exe est publié malgré tout."
